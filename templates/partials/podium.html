{# items — Alpine ifodasi: [{rank, name, avatar, score, school_class}]. 3 -> 2 -> 1 tartibida ko'tariladi #}
<div class="flex items-end justify-center gap-3 sm:gap-8 pt-6" x-show="{{ items }}.length">
  <template x-for="slot in [{pos:2,h:'h-36',c:'#cbd5e1',m:'🥈',d:'1.4s'},{pos:1,h:'h-56',c:'#ffc83d',m:'🥇',d:'2.8s'},{pos:3,h:'h-24',c:'#fdba74',m:'🥉',d:'0s'}]" :key="slot.pos">
    <div class="flex flex-col items-center w-28 sm:w-44" x-show="{{ items }}.find(p => p.rank === slot.pos)">
      <template x-if="{{ items }}.find(p => p.rank === slot.pos)">
        <div class="podium-person flex flex-col items-center text-center" :style="`animation-delay:calc(${slot.d} + .5s)`">
          <div x-show="slot.pos===1" class="crown text-5xl -mb-2" :style="`animation-delay:${slot.d}`">👑</div>
          <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full overflow-hidden ring-4 ring-white shadow-xl" x-avatar="{{ items }}.find(p => p.rank === slot.pos).avatar"></div>
          <div class="font-extrabold text-sm sm:text-lg truncate max-w-full" x-text="{{ items }}.find(p => p.rank === slot.pos).name"></div>
          <div class="text-xs opacity-80" x-text="{{ items }}.find(p => p.rank === slot.pos).school_class"></div>
          <div class="font-kid font-extrabold text-xl num" x-text="{{ items }}.find(p => p.rank === slot.pos).score + ' ball'"></div>
        </div>
      </template>
      <div class="podium-bar w-full rounded-t-3xl flex items-start justify-center pt-2 text-4xl text-slate-800" :class="slot.h" :style="`background:${slot.c};animation-delay:${slot.d}`" x-text="slot.m"></div>
    </div>
  </template>
</div>
