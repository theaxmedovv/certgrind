{% extends "teacher/base.html" %}
{% block title %}Parolni o'zgartirish — Bilimdon{% endblock %}
{% block content %}
<h1 class="text-2xl font-extrabold mb-4">Parolni o'zgartirish</h1>
<form method="post" class="card p-5 max-w-md space-y-3">{% csrf_token %}
  {% for f in form %}
    <label class="block text-sm font-bold">{{ f.label }}<div class="mt-1 [&_input]:w-full [&_input]:border-2 [&_input]:rounded-xl [&_input]:px-3 [&_input]:py-2 [&_input]:bg-card [&_input]:border-line">{{ f }}</div></label>
    {% for e in f.errors %}<p class="text-bad-dark text-sm font-semibold">{{ e }}</p>{% endfor %}
  {% endfor %}
  <button class="btn-3d btn-brand sm">Saqlash</button>
</form>
{% endblock %}
