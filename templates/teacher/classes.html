{% extends "teacher/base.html" %}
{% block title %}Sinflar — Bilimdon{% endblock %}
{% block content %}
<h1 class="text-2xl font-extrabold mb-4">Sinflar ro'yxati</h1>
<div class="card p-5 max-w-lg space-y-4">
  <form method="post" class="flex gap-2">{% csrf_token %}
    <input name="name" placeholder="Masalan: 7-A" maxlength="20" class="input flex-1" required>
    <button class="btn-3d btn-brand sm">Qo'shish</button>
  </form>
  <div class="flex flex-wrap gap-2">
    {% for c in classes %}
    <form method="post" action="{% url 'class_delete' c.pk %}" onsubmit="return confirm('{{ c.name }} o\'chirilsinmi?')" class="chip !text-base !py-1.5">{% csrf_token %}{{ c.name }}
      <button class="ml-1 text-bad-dark" aria-label="O'chirish">✕</button></form>
    {% empty %}<p class="muted">Sinflar yo'q. O'quvchilar xonaga kirishi uchun sinf qo'shing.</p>{% endfor %}
  </div>
</div>
{% endblock %}
