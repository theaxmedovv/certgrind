<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bilimdon{% endblock %}</title>
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    // Dizayn tokenlari (CSS o'zgaruvchilari) Tailwind'ga ulangan
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: {
          brand: 'rgb(var(--c-brand) / <alpha-value>)', 'brand-dark': 'rgb(var(--c-brand-dark) / <alpha-value>)',
          sun: 'rgb(var(--c-sun) / <alpha-value>)', 'sun-dark': 'rgb(var(--c-sun-dark) / <alpha-value>)',
          ok: 'rgb(var(--c-ok) / <alpha-value>)', 'ok-dark': 'rgb(var(--c-ok-dark) / <alpha-value>)',
          bad: 'rgb(var(--c-bad) / <alpha-value>)', 'bad-dark': 'rgb(var(--c-bad-dark) / <alpha-value>)',
          ice: 'rgb(var(--c-ice) / <alpha-value>)',
          surface: 'rgb(var(--c-bg) / <alpha-value>)', card: 'rgb(var(--c-card) / <alpha-value>)',
          ink: 'rgb(var(--c-ink) / <alpha-value>)', muted: 'rgb(var(--c-muted) / <alpha-value>)', line: 'rgb(var(--c-line) / <alpha-value>)',
        },
        fontFamily: { kid: ['Baloo 2', 'Nunito', 'sans-serif'], ui: ['Inter', 'sans-serif'] },
        borderRadius: { '2xl': '20px', '3xl': '24px' },
      } },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %} min-h-screen">
  {% block body %}{% endblock %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/static/js/sound.js"></script>
  <script src="/static/js/fx.js"></script>
  <script src="/static/js/core.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
